apiVersion: v1
kind: Service
metadata:
  name: techtrends            # Name of the Service
  namespace: sandbox          # Namespace where the Service will be created
spec:
  type: ClusterIP             # Default service type; exposes the app internally within the cluster
  selector:
    app: techtrends           # Must match the labels on the Deployment's pods
  ports:
    - name: http              # Logical name for the port (optional but recommended)
      protocol: TCP           # Protocol used by the service (TCP for web apps)
      port: 4111              # Port exposed inside the cluster (service port)
      targetPort: 3111        # Port on the container where the app actually listens

